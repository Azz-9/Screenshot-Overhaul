# Important Notes:
# Every field you add must be added to buildSrc/src/main/groovy/multiloader-common.gradle expandProps map.

# Project
mod_version=0.1-26.2
# stable, beta, alpha
version_type=alpha
group=me.Azz_9.screenshot_overhaul
java_version=25

# Common
minecraft_version=26.2
mod_name=Screenshot Overhaul
mod_author=Azz_9
mod_id=screenshot_overhaul
license=MIT
description=Improve Minecraft screenshots with a built-in gallery, metadata, custom names, previews, panoramas, and map integrations.
minecraft_compatibility=~26.2
minecraft_version_range=[26.2, 26.3)
minecraft_version_start=26.2
minecraft_version_end=26.2
issues=https://github.com/Azz-9/Screenshot-Overhaul/issues
sources=https://github.com/Azz-9/Screenshot-Overhaul
## This is the version of minecraft that the 'common' project uses, you can find a list of all versions here
## https://projects.neoforged.net/neoforged/neoform
neo_form_version=26.2-1

# Fabric, see https://fabricmc.net/develop/ for new versions
fabric_version=0.153.0+26.2
fabric_loader_version=0.19.3

# NeoForge, see https://projects.neoforged.net/neoforged/neoforge for new versions
neoforge_version=26.2.0.1-beta
neoforge_loader_version_range=[4,)

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

# https://maven.terraformersmc.com/releases/com/terraformersmc/modmenu
# https://modrinth.com/mod/modmenu
