launch_with_xaero_worldmap=true
# https://maven.blamejared.com/info/journeymap/journeymap-api-fabric/
journeymap_api_version=26.2-2.0.0
# https://modrinth.com/mod/iris
iris_shader_version=1.11.2+26.2
launch_with_iris_and_sodium=true
# https://modrinth.com/mod/sodium
sodium_version=26.2-0.9.1